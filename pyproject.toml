[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Babacar Faye", email = "bf322003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pypdf>=6.21.4",
    "recursivecharactertextsplitter>=0.1.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
